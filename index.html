<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Name That Candy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
:root{
  --bg:#2a1630; --panel:#3a2142; --line:#57345f;
  --fg:#fdf1e6; --muted:#cbb2c9;
  --caramel:#f2a33a; --mint:#7fd8be; --berry:#ff6f91; --ink:#2a1630;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:repeating-linear-gradient(135deg,transparent 0 22px,rgba(242,163,58,.05) 22px 44px)}
.wrap{max-width:1200px;margin:0 auto;padding-block:20px 28px;display:flex;flex-direction:column;gap:18px;min-height:100%}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,44px);margin:0;letter-spacing:.5px}
h1 span{color:var(--caramel)}
.progress{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.stage{display:grid;grid-template-columns:1fr 240px;gap:18px;flex:1}
@media (max-width:820px){.stage{grid-template-columns:1fr}}
.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:28px clamp(16px,4vw,40px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;min-height:360px;min-width:0}
.joinPanel{background:var(--fg);color:var(--ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;align-self:start}
.joinPanel h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
#qr{background:#fff;padding:8px;border-radius:10px;line-height:0}
#qr img,#qr canvas{width:180px!important;height:180px!important}
.code{font-family:var(--display);font-size:40px;letter-spacing:.15em;color:#b5465f}
.small{font-size:13px;font-weight:600;word-break:break-all}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#bbb;margin-right:6px;vertical-align:middle}
.dot.on{background:#2fa37f}
.lockBtn{color:var(--ink);border-color:var(--ink);font-size:15px;padding:8px 14px}
.lockBtn.locked{background:var(--ink);color:var(--fg)}
.joinPanel.locked #qr,.joinPanel.locked .code,.joinPanel.locked .small:first-of-type{opacity:.15}
.kick{font-size:12px;padding:2px 8px;margin-left:6px;border-radius:8px;color:var(--muted)}
.chip{font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;border-radius:999px;border:2px solid currentColor}
.easy{color:var(--mint)}.medium{color:var(--caramel)}.hard{color:var(--berry)}
.emoji{font-size:clamp(72px,13vw,150px);line-height:1.1;letter-spacing:.08em}
.answer{font-family:var(--display);font-size:clamp(32px,6vw,64px);color:var(--caramel);min-height:1.2em}
.answer.hidden{color:transparent;background:repeating-linear-gradient(90deg,var(--line) 0 18px,transparent 18px 26px);border-radius:10px;min-width:min(420px,80%)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font-family:var(--body);font-weight:800;font-size:17px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--fg);padding:10px 18px;cursor:pointer}
button:hover{border-color:var(--caramel)}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
button.primary{background:var(--caramel);border-color:var(--caramel);color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
.award{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.award button{border-color:var(--mint)}
.label{color:var(--muted);font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.award .label{width:100%}
.buzzes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:48px;align-items:center}
.buzz{font-family:var(--display);font-size:24px;padding:6px 18px;border-radius:999px;background:var(--line)}
.buzz.first{background:var(--berry);color:var(--ink);font-size:32px}
@media (prefers-reduced-motion:no-preference){.buzz.first{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.team{border:2px solid var(--line);border-radius:16px;padding:12px 16px;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px}
.team input{background:transparent;border:0;color:var(--fg);font:800 18px var(--body);min-width:0;width:100%}
.team input:focus{outline:2px dashed var(--line);border-radius:6px}
.team .who{grid-column:1/-1;font-size:13px;color:var(--muted);font-weight:600}
.team .who.on{color:var(--mint)}
.pts{font-family:var(--display);font-size:36px;color:var(--caramel);font-variant-numeric:tabular-nums}
.adj{display:flex;flex-direction:column;gap:4px}
.adj button{padding:0 10px;font-size:15px;line-height:1.4}
.team.lead{border-color:var(--caramel)}
footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;align-items:center}
.final{font-family:var(--display);font-size:clamp(36px,6vw,64px);color:var(--caramel)}

/* phone */
.phone{max-width:480px;margin:0 auto;padding-block:20px 28px;min-height:100%;display:flex;flex-direction:column;gap:18px;text-align:center}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.teams button{padding:16px 10px;font-size:18px}
.teams button.on{background:var(--mint);border-color:var(--mint);color:var(--ink)}
.big{aspect-ratio:1;width:min(300px,80vw);margin:8px auto 0;border-radius:50%;
  font-family:var(--display);font-size:56px;background:var(--berry);border:0;color:var(--ink);
  box-shadow:0 12px 0 #a33a58,0 16px 30px rgba(0,0,0,.4);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.big:active:not(:disabled){transform:translateY(8px);box-shadow:0 4px 0 #a33a58}
.big:disabled{background:var(--line);box-shadow:0 12px 0 #2f1a36;color:var(--muted);opacity:1}
.status{font-family:var(--display);font-size:30px;min-height:1.3em}
.note{color:var(--muted);font-size:15px;line-height:1.5;margin:0}
.codeIn{display:flex;gap:10px;justify-content:center}
.codeIn input{font:400 32px var(--display);letter-spacing:.2em;width:7.5em;text-align:center;text-transform:uppercase;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--fg);padding:6px}
</style>
</head>
<body>

<div class="wrap" id="host" hidden>
  <header>
    <h1>Name That <span>Candy</span></h1>
    <div class="progress" id="progress"></div>
  </header>
  <div class="stage">
    <section class="card" id="card" aria-live="polite"></section>
    <aside class="joinPanel">
      <h2>Buzz in!</h2>
      <div id="qr"></div>
      <div class="small">Scan, or go to<br><b id="joinUrl"></b><br>and enter code</div>
      <div class="code" id="roomCode">····</div>
      <div class="small"><span class="dot" id="netDot"></span><span id="netText">Connecting…</span></div>
      <button id="lockBtn" class="lockBtn">🔓 Lock joining</button>
    </aside>
  </div>
  <section class="scores" id="scores" aria-label="Team scores"></section>
  <footer>
    <div class="row">
      <button id="addTeam">+ Team</button>
      <button id="removeTeam">− Team</button>
      <button id="reset">New game</button>
    </div>
    <div>Keys: <b>Space</b> reveal · <b>→ / ←</b> next / back · <b>1–6</b> award · <b>C</b> clear buzzes</div>
  </footer>
</div>

<div class="phone" id="phone" hidden>
  <h1>Name That <span>Candy</span></h1>
  <div id="codeStep" hidden>
    <p class="note">Enter the 4-letter code on the big screen</p>
    <form class="codeIn" id="codeForm" style="margin-top:12px"><input id="codeInput" maxlength="4" autocomplete="off" autocapitalize="characters" inputmode="text" aria-label="Game code"><button class="primary">Join</button></form>
    <p class="note" style="margin-top:28px;font-size:13px"><a href="?host" style="color:var(--muted)">Run the big-screen board on this device instead</a></p>
  </div>
  <div id="playStep" hidden style="display:flex;flex-direction:column;gap:18px">
    <div>
      <div class="label" style="margin-bottom:8px">Your team</div>
      <div class="teams" id="teamPick"></div>
    </div>
    <div class="status" id="pStatus" aria-live="assertive"></div>
    <button class="big" id="buzzBtn" disabled>BUZZ</button>
    <p class="note" id="pNote">Connecting to the big screen…</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const CLUES=[
 ["easy","🍬🌽","Candy Corn"],["easy","🐟🇸🇪","Swedish Fish"],["easy","⭐💥","Starburst"],["easy","🧰🐱","Kit Kat"],
 ["easy","🤓🤓","Nerds"],["easy","🧠🧠","Smarties"],["easy","🛟","Life Savers"],["easy","🌈👅","Skittles"],
 ["medium","🥛🛣️","Milky Way"],["medium","3️⃣🤺","3 Musketeers"],["medium","🧈👆","Butterfinger"],["medium","🌰😊","Almond Joy"],
 ["medium","💯💵","100 Grand"],["medium","💰📅","PayDay"],["medium","😄🤠","Jolly Rancher"],["medium","🌶️🫔","Hot Tamales"],["medium","🎵🪨","Pop Rocks"],
 ["hard","🍋🩹👧","Sour Patch Kids"],["hard","🌬️🧠","Airheads"],["hard","🤥","Whoppers"],["hard","🥛🧨❌","Milk Duds"],
 ["hard","⛰️⛰️","Mounds"],["hard","🤭","Snickers"],["hard","😂🍬","Laffy Taffy"]
];
const PTS={easy:1,medium:2,hard:3};
// Two independent free public relays; everything is sent through both, so either one being up is enough.
const BROKERS=["wss://broker.hivemq.com:8884/mqtt","wss://broker.emqx.io:8084/mqtt"];
const NS="name-that-candy-una-v2/";
const topicState=c=>NS+c+"/state";
const topicUp=c=>NS+c+"/up";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
const rid=n=>{const a="abcdefghijkmnpqrstuvwxyz23456789";let s="";const r=crypto.getRandomValues(new Uint8Array(n));for(const x of r)s+=a[x%a.length];return s};
const params=new URLSearchParams(location.search);
// Phones get the join screen by default; ?host forces the board, ?join forces the buzzer.
const looksLikePhone=window.matchMedia("(pointer:coarse)").matches&&Math.min(screen.width,screen.height)<700;
const IS_PHONE=params.has("join")||(!params.has("host")&&looksLikePhone);
const baseUrl=location.origin+location.pathname;
function connectBroker(clientTag){
  const cs=BROKERS.map(u=>mqtt.connect(u,{clientId:"ntc-"+clientTag+"-"+rid(8),clean:true,reconnectPeriod:2500,connectTimeout:8000,keepalive:20}));
  return {
    get connected(){return cs.some(c=>c.connected)},
    on(ev,fn){cs.forEach(c=>c.on(ev,fn));return this},
    removeListener(ev,fn){cs.forEach(c=>c.removeListener(ev,fn))},
    publish(t,m,o){cs.forEach(c=>{if(c.connected)c.publish(t,m,o||{})})},
    subscribe(t,cb){cs.forEach(c=>{if(c.connected)c.subscribe(t)});if(cb)setTimeout(cb,0)},
    unsubscribe(t){cs.forEach(c=>{if(c.connected)c.unsubscribe(t)})},
    end(f){cs.forEach(c=>c.end(f))}
  };
}

/* =============== HOST =============== */
const fresh=()=>({i:0,revealed:false,awarded:{},clear:0,teams:[{name:"Team 1",score:0},{name:"Team 2",score:0}]});
let S, order=[], roundId="";
let phones=new Map();      // phoneId -> {team, seen}
let kicked=new Set(), locked=false, client=null, code=null, online=false;

function newCode(){const a="ABCDEFGHJKMNPQRSTUVWXYZ";let s="";const r=crypto.getRandomValues(new Uint8Array(4));for(const x of r)s+=a[x%a.length];return s}
const currentRound=()=>`${S.i}-${S.clear||0}`;
const buzzOpen=()=>S.i<CLUES.length&&!S.revealed;
function syncRound(){const r=currentRound();if(r!==roundId){roundId=r;order=[]}}
function save(){ls.set("ntc-state",JSON.stringify(S))}

function render(){
  syncRound();
  const card=$("card");
  if(S.i>=CLUES.length){
    const top=Math.max(...S.teams.map(t=>t.score));
    const winners=S.teams.filter(t=>t.score===top).map(t=>t.name).join(" & ");
    $("progress").textContent="Final";
    card.innerHTML=`<div class="chip medium">Sweet victory</div><div class="emoji">🏆🍭</div>
      <div class="final">${esc(winners)}</div><div class="row"><button id="back">Back</button></div>`;
    $("back").onclick=()=>go(-1);
  }else{
    const [lvl,emo,ans]=CLUES[S.i];
    const got=S.awarded[S.i];
    $("progress").textContent=`Clue ${S.i+1} of ${CLUES.length}`;
    const buzzHtml=order.length
      ?order.map((b,n)=>`<span class="buzz ${n===0?"first":""}">${n+1}. ${esc(S.teams[b]?.name||"?")}</span>`).join("")
      :`<span class="label">${S.revealed?"Buzzers locked":"Buzzers open"}</span>`;
    card.innerHTML=`<div class="chip ${lvl}">${lvl} · ${PTS[lvl]} pt${PTS[lvl]>1?"s":""}</div>
      <div class="emoji">${emo}</div>
      <div class="buzzes">${buzzHtml}</div>
      <div class="answer ${S.revealed?"":"hidden"}">${S.revealed?ans:"&nbsp;"}</div>
      ${S.revealed?`<div class="award"><div class="label">${got!=null?`Awarded to ${esc(S.teams[got]?.name||"")}`:"Who got it?"}</div>
        ${S.teams.map((t,k)=>`<button data-k="${k}" ${got===k?'class="primary"':""}>${esc(t.name)}</button>`).join("")}
        <button data-k="none">Nobody</button></div>`:""}
      <div class="row"><button id="prev">← Back</button>
        ${!S.revealed&&order.length?`<button id="clr">Clear buzzes</button>`:""}
        ${S.revealed?`<button class="primary" id="next">Next →</button>`:`<button class="primary" id="rev">Reveal</button>`}</div>`;
    $("prev").onclick=()=>go(-1);
    $("rev")&&($("rev").onclick=reveal);
    $("next")&&($("next").onclick=()=>go(1));
    $("clr")&&($("clr").onclick=clearBuzzes);
    card.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>award(b.dataset.k));
  }
  renderScores();save();broadcast();
}
function claimOf(team){for(const [id,p] of phones)if(p.team===team)return id;return null}
function renderScores(){
  const top=Math.max(...S.teams.map(t=>t.score));
  $("scores").innerHTML=S.teams.map((t,k)=>{const has=claimOf(k)!=null;return `<div class="team ${t.score===top&&top>0?"lead":""}">
    <input id="team-${k}" aria-label="Team name" value="${esc(t.name)}" data-k="${k}">
    <div class="pts">${t.score}</div>
    <div class="adj"><button data-up="${k}" aria-label="Add point">+</button><button data-dn="${k}" aria-label="Remove point">−</button></div>
    <div class="who ${has?"on":""}">${has?`📱 Buzzer connected<button class="kick" data-kick="${k}">Remove</button>`:"No buzzer yet"}</div></div>`}).join("");
  $("scores").querySelectorAll("input").forEach(inp=>inp.onchange=()=>{S.teams[inp.dataset.k].name=inp.value||`Team ${+inp.dataset.k+1}`;render()});
  $("scores").querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{S.teams[b.dataset.up].score++;render()});
  $("scores").querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{S.teams[b.dataset.dn].score--;render()});
  $("scores").querySelectorAll("[data-kick]").forEach(b=>b.onclick=()=>{
    const id=claimOf(+b.dataset.kick);if(id){kicked.add(id);phones.delete(id)}render()});
}
function reveal(){S.revealed=true;render()}
function go(d){S.i=Math.max(0,Math.min(CLUES.length,S.i+d));S.revealed=S.awarded[S.i]!=null;render()}
function clearBuzzes(){S.clear=(S.clear||0)+1;render()}
function award(k){
  const pts=PTS[CLUES[S.i][0]];const prev=S.awarded[S.i];
  if(prev!=null&&S.teams[prev])S.teams[prev].score-=pts;
  if(k==="none"||+k===prev){delete S.awarded[S.i]}else{S.awarded[S.i]=+k;S.teams[+k].score+=pts}
  render();
}
let actx=null;
function ding(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  [880,1320].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=f;o.connect(g);g.connect(actx.destination);
  const t=actx.currentTime+i*.12;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)})}catch(e){}}

function stateMsg(){
  const claims={};for(const [id,p] of phones)if(p.team!=null)claims[id]=p.team;
  return {ts:Date.now(),round:roundId,open:buzzOpen(),teams:S.teams.map(t=>t.name),order,claims,locked,kicked:[...kicked].slice(-20)};
}
function broadcast(){if(client&&client.connected)client.publish(topicState(code),JSON.stringify(stateMsg()),{qos:0,retain:true})}

function onUp(raw){
  let d;try{d=JSON.parse(raw)}catch(e){return}
  if(!d||typeof d.from!=="string"||d.from.length>40||kicked.has(d.from))return;
  let p=phones.get(d.from);
  if(!p){ if(locked)return; p={team:null,seen:0}; phones.set(d.from,p) }
  p.seen=Date.now();
  if(typeof d.team==="number"&&S.teams[d.team]&&p.team!==d.team){
    const other=claimOf(d.team);
    if(other==null||other===d.from)p.team=d.team;
  }
  if(d.type==="buzz"){
    syncRound();
    if(buzzOpen()&&d.round===roundId&&p.team!=null&&!order.includes(p.team)){
      order.push(p.team);if(order.length===1)ding();
    }
  }
  render();
}
function setNet(on,text){$("netDot").className="dot"+(on?" on":"");$("netText").textContent=text}
function setLock(v){locked=v;$("lockBtn").textContent=v?"🔒 Joining locked":"🔓 Lock joining";
  $("lockBtn").classList.toggle("locked",v);document.querySelector(".joinPanel").classList.toggle("locked",v);render()}
function showJoin(){
  $("roomCode").textContent=code;
  $("joinUrl").textContent=baseUrl.replace(/^https?:\/\//,"");
  $("qr").innerHTML="";
  new QRCode($("qr"),{text:`${baseUrl}?join=${code}`,width:360,height:360,colorDark:"#2a1630",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
}
function hostConnect(){
  client=connectBroker("host");
  let checked=false;
  client.on("connect",()=>{
    online=true;
    if(!checked){
      // make sure nobody else is live on this code; if so, pick another
      checked=true;let busy=false;
      const t=topicState(code);
      const probe=(top,msg)=>{if(top!==t)return;try{const d=JSON.parse(msg.toString());if(d.ts&&Date.now()-d.ts<20000)busy=true}catch(e){}};
      client.on("message",probe);
      client.subscribe(t,()=>setTimeout(()=>{
        client.removeListener("message",probe);client.unsubscribe(t);
        if(busy){code=newCode();ss.set("ntc-code",code);showJoin()}
        client.on("message",(top,msg)=>{if(top===topicUp(code))onUp(msg.toString())});
        client.subscribe(topicUp(code));
        setNet(true,"Ready for phones");broadcast();
      },1500));
    }else{client.subscribe(topicUp(code));setNet(true,"Ready for phones");broadcast()}
  });
  client.on("offline",()=>{online=client.connected;if(!online)setNet(false,"Offline – reconnecting…")});
  setInterval(()=>{ // heartbeat + drop silent phones
    const now=Date.now();let changed=false;
    for(const [id,p] of phones)if(now-p.seen>20000){phones.delete(id);changed=true}
    changed?render():broadcast();
  },5000);
  window.addEventListener("pagehide",()=>{try{client.publish(topicState(code),"",{retain:true})}catch(e){}});
}
function startHost(){
  $("host").hidden=false;
  try{S=JSON.parse(ls.get("ntc-state"))}catch(e){}
  if(!S||!Array.isArray(S.teams))S=fresh();
  code=ss.get("ntc-code");if(!code){code=newCode();ss.set("ntc-code",code)}
  showJoin();
  $("addTeam").onclick=()=>{if(S.teams.length<6){S.teams.push({name:`Team ${S.teams.length+1}`,score:0});render()}};
  $("removeTeam").onclick=()=>{if(S.teams.length>1){const k=S.teams.length-1;for(const q in S.awarded)if(S.awarded[q]===k)delete S.awarded[q];
    for(const p of phones.values())if(p.team===k)p.team=null;S.teams.pop();render()}};
  let armed=false;
  $("reset").onclick=e=>{if(!armed){armed=true;e.target.textContent="Click again to reset";setTimeout(()=>{armed=false;e.target.textContent="New game"},2500)}
    else{const names=S.teams.map(t=>t.name);S=fresh();S.teams=names.map(n=>({name:n,score:0}));armed=false;e.target.textContent="New game";render()}};
  $("lockBtn").onclick=()=>setLock(!locked);
  document.addEventListener("keydown",e=>{
    if(e.target.tagName==="INPUT")return;
    if(e.key===" "){e.preventDefault();S.revealed?go(1):reveal()}
    else if(e.key==="ArrowRight")go(1);
    else if(e.key==="ArrowLeft")go(-1);
    else if(e.key==="c"||e.key==="C")clearBuzzes();
    else if(/^[1-6]$/.test(e.key)&&S.revealed&&S.i<CLUES.length&&S.teams[e.key-1])award(String(e.key-1));
  });
  render();
  if(window.mqtt)hostConnect();else setNet(false,"Couldn't load buzzer service – check internet");
}

/* =============== PHONE =============== */
const P={code:null,id:null,team:null,state:null,buzzed:null,client:null,stopped:false,lastTs:0};
function stopPhone(msg){P.stopped=true;$("pStatus").textContent="";$("buzzBtn").disabled=true;$("teamPick").innerHTML="";$("pNote").textContent=msg;try{P.client.end(true)}catch(e){}}
function send(m){if(P.client&&P.client.connected&&!P.stopped)P.client.publish(topicUp(P.code),JSON.stringify({...m,from:P.id}))}
function phoneConnect(){
  $("codeStep").hidden=true;$("playStep").hidden=false;
  if(!window.mqtt){$("pNote").textContent="Couldn't load. Check your connection and refresh.";return}
  P.id=ss.get("ntc-pid")||rid(12);ss.set("ntc-pid",P.id);
  const t=ls.get("ntc-team");P.team=(t==null||t==="")?null:+t;
  P.client=connectBroker("phone");
  P.client.on("connect",()=>{P.client.subscribe(topicState(P.code));send({type:"hello",team:P.team});renderPhone()});
  P.client.on("message",(top,msg)=>{
    if(top!==topicState(P.code))return;
    const raw=msg.toString();if(!raw){P.state=null;$("pNote").textContent="The big screen closed this game.";renderPhone();return}
    let d;try{d=JSON.parse(raw)}catch(e){return}
    if(!d||!Array.isArray(d.teams)||Date.now()-(d.ts||0)>30000)return;
    P.lastTs=Date.now();
    if(Array.isArray(d.kicked)&&d.kicked.includes(P.id))return stopPhone("The host removed this phone from the game.");
    const mine=d.claims&&typeof d.claims[P.id]==="number"?d.claims[P.id]:null;
    if(d.locked&&mine==null)return stopPhone("Joining is locked for this game. Ask the host if you need in.");
    if(P.state&&P.state.round!==d.round)P.buzzed=null;
    P.state={round:String(d.round),open:!!d.open,teams:d.teams.slice(0,6).map(String),order:Array.isArray(d.order)?d.order:[],claims:d.claims||{},mine};
    renderPhone();
  });
  P.client.on("offline",()=>{if(!P.stopped&&!P.client.connected)$("pNote").textContent="Reconnecting…"});
  setInterval(()=>{ // heartbeat, and notice if the board went away
    if(P.stopped)return;
    send({type:"hello",team:P.team});
    if(P.client.connected&&Date.now()-P.lastTs>15000){P.state=null;renderPhone();$("pNote").textContent="Can't find that game. Check the code on the big screen."}
  },5000);
  setTimeout(()=>{if(!P.state&&!P.stopped)$("pNote").textContent="Can't find that game. Check the code on the big screen."},6000);
}
function renderPhone(){
  if(P.stopped)return;
  const st=P.state,teams=st?.teams||[];
  const takenBy=k=>{for(const id in (st?.claims||{}))if(st.claims[id]===k&&id!==P.id)return true;return false};
  $("teamPick").innerHTML=teams.length
    ?teams.map((n,k)=>`<button data-t="${k}" class="${st.mine===k?"on":""}" ${takenBy(k)?"disabled":""}>${esc(n)}${takenBy(k)?"<br><small>taken</small>":""}</button>`).join("")
    :`<span class="note" style="grid-column:1/-1">Teams appear once you're connected.</span>`;
  $("teamPick").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{P.team=+b.dataset.t;ls.set("ntc-team",String(P.team));send({type:"hello",team:P.team});$("pStatus").textContent="Joining…"});
  const btn=$("buzzBtn"),status=$("pStatus"),note=$("pNote");
  if(!st){btn.disabled=true;status.textContent="";if(P.client&&P.client.connected&&!P.lastTs)note.textContent="Connecting to the big screen…";return}
  if(st.mine==null){btn.disabled=true;
    if(P.team!=null&&takenBy(P.team)){status.textContent="That team already has a buzzer";status.style.color="var(--berry)"}
    else{status.textContent="Pick your team";status.style.color="var(--fg)"}
    note.textContent="";return}
  const pos=st.order.indexOf(st.mine);
  btn.disabled=!st.open||pos>=0||P.buzzed===st.round;
  if(pos>=0){status.textContent=pos===0?"🔔 You're first!":`You're #${pos+1}`;status.style.color=pos===0?"var(--berry)":"var(--caramel)"}
  else if(P.buzzed===st.round){status.textContent="Buzzed…";status.style.color="var(--muted)"}
  else if(st.open){status.textContent="Ready!";status.style.color="var(--mint)"}
  else{status.textContent="Locked";status.style.color="var(--muted)"}
  note.textContent=st.open?"Buzz as soon as your team knows it.":"Waiting for the next clue.";
}
function startPhone(){
  $("phone").hidden=false;
  $("buzzBtn").onclick=()=>{
    const st=P.state;if(!st||!st.open||st.mine==null)return;
    P.buzzed=st.round;try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
    send({type:"buzz",team:st.mine,round:st.round});renderPhone();
  };
  const c=(params.get("join")||"").trim().toUpperCase();
  if(/^[A-Z]{4}$/.test(c)){P.code=c;phoneConnect()}
  else{
    $("codeStep").hidden=false;$("playStep").hidden=true;
    $("codeForm").onsubmit=e=>{e.preventDefault();const v=$("codeInput").value.trim().toUpperCase();
      if(/^[A-Z]{4}$/.test(v)){history.replaceState(null,"",`?join=${v}`);P.code=v;phoneConnect()}};
  }
}

IS_PHONE?startPhone():startHost();
</script>
